<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #05192d; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #0a2540; border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 28px 24px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 16px; display: block; border: 2px solid #10b981; }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .qr-box { background: #fff; padding: 12px; border-radius: 16px; display: inline-block; margin-bottom: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
    .qr-box img { width: 180px; height: 180px; display: block; }
    .btn { display: block; width: 100%; padding: 14px; background: #10b981; color: #05192d; text-decoration: none; font-weight: 800; font-size: 15px; border-radius: 14px; margin-bottom: 12px; transition: 0.2s; border: none; cursor: pointer; }
    .btn:hover { background: #059669; color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }
    .steps { text-align: left; background: rgba(0,0,0,0.2); padding: 16px; border-radius: 14px; font-size: 12px; line-height: 1.6; color: #cbd5e1; margin-top: 16px; }
    .steps strong { color: #34d399; }
  </style>
</head>
<body>
  <div class="card">

    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https%3A%2F%2Fais-dev-w6kp5d7vanc6fqya3hrxlg-704519896893.asia-northeast1.run.app" alt="Scan to install">

    <a href="/" class="btn">📱 অ্যাপটি ওপেন করুন</a>

      <p>৩. সাথে সাথে ফোনে আসল অ্যাপের মতো <strong>Yasin Telecom</strong> ইনস্টল হয়ে যাবে।</p>
    </div>
